name: mern-blog

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: 5000
  MONGODB_URI: mongodb://mongodb:27017/mern_blog
  FRONTEND_URL: http://localhost:5173
  BACKEND_URL: http://localhost:5173
  GOOGLE_CALLBACK_URL: http://localhost:5173/api/v1/auth/google/callback
  FACEBOOK_CALLBACK_URL: http://localhost:5173/api/v1/auth/facebook/callback
  COOKIE_SECURE: "false"

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mern_blog_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment: *backend-environment
    command: ["node", "backend/dist/scripts/create-indexes.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment: *backend-environment
    depends_on:
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    env_file:
      - backend/.env
    environment: *backend-environment
    command: ["node", "backend/dist/scripts/seed.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mern_blog_data:
